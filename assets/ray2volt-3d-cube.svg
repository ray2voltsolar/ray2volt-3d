<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" class="r2v3d-cube" role="img" aria-labelledby="title desc">
<title id="title">Ray2Volt 3D cube</title>
<desc id="desc">True-isometric cube built from the Ray2Volt panel tile: three blue solar-panel faces with a 3 by 3 cell grid, lit from the top left; the parent logo's yellow-to-orange lightning "2" sits upright on the right face.</desc>
<style>@media (max-width:200px){.r2v3d-cube .bolt-place{stroke-width:15px}.r2v3d-cube .bolt-sweep{display:inline}}@media (max-width:128px){.r2v3d-cube .bolt-place{stroke-width:16.5px}.r2v3d-cube .bolt-sweep{display:inline}.r2v3d-cube .grid{opacity:0.75}}</style>
<!-- Structure: #cube-back (a group: the rounded-hexagon outline plus a shaded wedge for the right face band), then #face-top, #face-left, #face-right: plain wrapper groups with no transform, each holding one .face-tile group (rect.rim, on the right face path#rimshade-right.shade, path.cells, #grid-*, path.shade overlay; on the top face the .shade also lights the rim band along the two back edges, and #edge-highlight sits in the top face). #bolt (inside #face-right) is a plain wrapper around .bolt-place, which holds #bolt-stroke-a (.bolt-stroke), g.bolt-sweep (display none: the small-size swept band) and #bolt-stroke-b (the second brush pass; it also carries the legacy class .bolt-shadow so the round-1 comp.js draws both passes on); their soft shadow is a filter on the gold group (no separate element), so it draws on with the strokes. Fold animation: tween the transform of every [data-flat] element (.face-tile x3 and .bolt-place) from data-flat to data-cube with a matrix lerp (keeps the hinges glued), fade the .shade paths (set their opacity; their tint is in fill-opacity) and #edge-highlight from 0 to 1, and fade #cube-back in only over the last ~10%. Both bolt paths have the same length, for a stroke-dashoffset draw-on. The <style> only acts when the file is drawn at 200 px or less (an <img>, a favicon-like use): .bolt-sweep shows (the two passes become one swept band), the brush is a little heavier at 128 px or less and the grid steps back; inlined into a larger page it does nothing. -->
<defs><linearGradient id="g-cells" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#3392C8"/><stop offset="1" stop-color="#2A84B7"/></linearGradient><linearGradient id="g-shade-top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A4E0FF" stop-opacity="0.52"/><stop offset="1" stop-color="#A4E0FF" stop-opacity="0.3"/></linearGradient><linearGradient id="g-shade-left" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#0B3A73" stop-opacity="0"/><stop offset="1" stop-color="#0B3A73" stop-opacity="0.12"/></linearGradient><linearGradient id="g-shade-right" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#0A3672" stop-opacity="0.4"/><stop offset="1" stop-color="#0A3672" stop-opacity="0.55"/></linearGradient><linearGradient id="g-bolt" gradientUnits="userSpaceOnUse" x1="1.74" y1="25.56" x2="97.96" y2="65.38"><stop offset="0" stop-color="#F0C10F"/><stop offset="0.15" stop-color="#F0C00F"/><stop offset="1" stop-color="#E6821F"/></linearGradient><linearGradient id="g-hilite" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="100" y2="0"><stop offset="0" stop-color="#D6F1FF" stop-opacity="0"/><stop offset="0.07" stop-color="#D6F1FF" stop-opacity="0.9"/><stop offset="0.5" stop-color="#D6F1FF" stop-opacity="0.85"/><stop offset="0.93" stop-color="#D6F1FF" stop-opacity="0.4"/><stop offset="1" stop-color="#D6F1FF" stop-opacity="0"/></linearGradient><filter id="f-bolt" filterUnits="userSpaceOnUse" x="-8.172" y="-4.14" width="126.0019" height="108.6828" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/><feOffset dx="1.1" dy="2" result="o"/><feFlood flood-color="#06244A" flood-opacity="0.3"/><feComposite in2="o" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<g id="cube-back"><path d="M505.5 66.5152 A13 13 0 0 1 518.5 66.5152 L894.5512 283.6284 A13 13 0 0 1 901.0512 294.8868 L901.0512 729.1132 A13 13 0 0 1 894.5512 740.3716 L518.5 957.4848 A13 13 0 0 1 505.5 957.4848 L129.4488 740.3716 A13 13 0 0 1 122.9488 729.1132 L122.9488 294.8868 A13 13 0 0 1 129.4488 283.6284 Z" fill="#1F5682"/><path d="M512 512 L899.3095 288.3868 A13 13 0 0 1 901.0512 294.8868 L901.0512 729.1132 A13 13 0 0 1 894.5512 740.3716 L518.5 957.4848 A13 13 0 0 1 512 959.2265 Z" fill="#0A3672" fill-opacity="0.5"/></g>
<g id="face-top"><g class="face-tile" transform="matrix(3.8105 2.2 -3.8105 2.2 512 72)" data-flat="matrix(0 0 -6.4 0.0001 832 192)" data-cube="matrix(3.8105 2.2 -3.8105 2.2 512 72)"><rect class="rim" x="-1.25" y="-1.25" width="102.5" height="102.5" rx="6.5" fill="#1F5682"/><path class="cells" d="M4.5 1.5 L96.9 1.5 A1.6 1.6 0 0 1 98.5 3.1 L98.5 97.4 A1.1 1.1 0 0 1 97.4 98.5 L3.1 98.5 A1.6 1.6 0 0 1 1.5 96.9 L1.5 4.5 A3 3 0 0 1 4.5 1.5 Z" fill="url(#g-cells)"/><g id="grid-top" class="grid" fill="#1F5682"><rect x="32.6667" y="1.5" width="1.75" height="97"/><rect x="65.5833" y="1.5" width="1.75" height="97"/><rect x="1.5" y="32.6667" width="97" height="1.75"/><rect x="1.5" y="65.5833" width="97" height="1.75"/></g><path id="shade-top" class="shade" d="M0.05 -1.25 L97.4 -1.25 A1.1 1.1 0 0 1 98.5 -0.15 L98.5 97.4 A1.1 1.1 0 0 1 97.4 98.5 L-0.15 98.5 A1.1 1.1 0 0 1 -1.25 97.4 L-1.25 0.05 A1.3 1.3 0 0 1 0.05 -1.25 Z" fill="url(#g-shade-top)"/><path id="edge-highlight" d="M-0.7 96.9 L-0.7 0.05 A0.75 0.75 0 0 1 0.05 -0.7 L96.9 -0.7" fill="none" stroke="url(#g-hilite)" stroke-width="0.9"/></g></g>
<g id="face-left"><g class="face-tile" transform="matrix(3.8105 2.2 0 4.4 130.9488 292)" data-flat="matrix(0.0001 0 0 6.4 192 192)" data-cube="matrix(3.8105 2.2 0 4.4 130.9488 292)"><rect class="rim" x="-1.25" y="-1.25" width="102.5" height="102.5" rx="6.5" fill="#1F5682"/><path class="cells" d="M3.1 1.5 L97.4 1.5 A1.1 1.1 0 0 1 98.5 2.6 L98.5 96.9 A1.6 1.6 0 0 1 96.9 98.5 L4.5 98.5 A3 3 0 0 1 1.5 95.5 L1.5 3.1 A1.6 1.6 0 0 1 3.1 1.5 Z" fill="url(#g-cells)"/><g id="grid-left" class="grid" fill="#1F5682"><rect x="32.6667" y="1.5" width="1.75" height="97"/><rect x="65.5833" y="1.5" width="1.75" height="97"/><rect x="1.5" y="32.6667" width="97" height="1.75"/><rect x="1.5" y="65.5833" width="97" height="1.75"/></g><path id="shade-left" class="shade" d="M3.1 1.5 L97.4 1.5 A1.1 1.1 0 0 1 98.5 2.6 L98.5 96.9 A1.6 1.6 0 0 1 96.9 98.5 L4.5 98.5 A3 3 0 0 1 1.5 95.5 L1.5 3.1 A1.6 1.6 0 0 1 3.1 1.5 Z" fill="url(#g-shade-left)"/></g></g>
