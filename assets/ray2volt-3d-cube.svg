<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
<title id="title">Ray2Volt 3D cube</title>
<desc id="desc">True-isometric cube built from the Ray2Volt panel tile: three blue solar-panel faces with a 3 by 3 cell grid, lit from the top left; the yellow-to-orange lightning "2" sits on the right face.</desc>
<!-- Animation: tween the transform of every element with data-flat (#face-top, #face-left, #face-right and #edge-highlight) from data-flat to data-cube (matrix lerp keeps the hinges glued and keeps the highlight on the top face back edges), fade the #shade-* rects and #edge-highlight from 0 to 1, and fade #cube-back in only over the last ~10% (earlier it shows as a ghost hexagon). #bolt (inside #face-right) holds .bolt-shadow and .bolt-stroke paths, usable for a stroke-dashoffset draw-on. -->
<defs><linearGradient id="g-cells" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#3392C8"/><stop offset="1" stop-color="#2A84B7"/></linearGradient><linearGradient id="g-shade-top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9BDCFF" stop-opacity="0.52"/><stop offset="1" stop-color="#9BDCFF" stop-opacity="0.3"/></linearGradient><linearGradient id="g-shade-left" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#06203D" stop-opacity="0"/><stop offset="1" stop-color="#06203D" stop-opacity="0.1"/></linearGradient><linearGradient id="g-shade-right" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#06203D" stop-opacity="0.36"/><stop offset="1" stop-color="#06203D" stop-opacity="0.5"/></linearGradient><linearGradient id="g-bolt" gradientUnits="userSpaceOnUse" x1="13.6" y1="14" x2="85.8" y2="82.4"><stop offset="0" stop-color="#F7C10A"/><stop offset="1" stop-color="#E6821F"/></linearGradient></defs>
<path id="cube-back" d="M512 72 L893.0512 292 L893.0512 732 L512 952 L130.9488 732 L130.9488 292 Z" fill="#123A5E" stroke="#123A5E" stroke-width="8" stroke-linejoin="round"/>
<g id="face-top" transform="matrix(3.8105 2.2 -3.8105 2.2 512 72)" data-flat="matrix(0 0 -6.4 0.0001 832 192)" data-cube="matrix(3.8105 2.2 -3.8105 2.2 512 72)"><rect class="rim" width="100" height="100" rx="8" fill="#1F5682"/><rect class="cells" x="3.1" y="3.1" width="93.8" height="93.8" rx="5.675" fill="url(#g-cells)"/><g id="grid-top" fill="#1F5682"><rect x="33.4167" y="3.1" width="1.9" height="93.8"/><rect x="64.6833" y="3.1" width="1.9" height="93.8"/><rect x="3.1" y="33.4167" width="93.8" height="1.9"/><rect x="3.1" y="64.6833" width="93.8" height="1.9"/></g><rect id="shade-top" class="shade" width="100" height="100" rx="8" fill="url(#g-shade-top)"/></g>
<g id="face-left" transform="matrix(3.8105 2.2 0 4.4 130.9488 292)" data-flat="matrix(0.0001 0 0 6.4 192 192)" data-cube="matrix(3.8105 2.2 0 4.4 130.9488 292)"><rect class="rim" width="100" height="100" rx="8" fill="#1F5682"/><rect class="cells" x="3.1" y="3.1" width="93.8" height="93.8" rx="5.675" fill="url(#g-cells)"/><g id="grid-left" fill="#1F5682"><rect x="33.4167" y="3.1" width="1.9" height="93.8"/><rect x="64.6833" y="3.1" width="1.9" height="93.8"/><rect x="3.1" y="33.4167" width="93.8" height="1.9"/><rect x="3.1" y="64.6833" width="93.8" height="1.9"/></g><rect id="shade-left" class="shade" width="100" height="100" rx="8" fill="url(#g-shade-left)"/></g>
<g id="face-right" transform="matrix(3.8105 -2.2 0 4.4 512 512)" data-flat="matrix(6.4 0 0 6.4 192 192)" data-cube="matrix(3.8105 -2.2 0 4.4 512 512)"><rect class="rim" width="100" height="100" rx="8" fill="#1F5682"/><rect class="cells" x="3.1" y="3.1" width="93.8" height="93.8" rx="5.675" fill="url(#g-cells)"/><g id="grid-right" fill="#1F5682"><rect x="33.4167" y="3.1" width="1.9" height="93.8"/><rect x="64.6833" y="3.1" width="1.9" height="93.8"/><rect x="3.1" y="33.4167" width="93.8" height="1.9"/><rect x="3.1" y="64.6833" width="93.8" height="1.9"/></g><rect id="shade-right" class="shade" width="100" height="100" rx="8" fill="url(#g-shade-right)"/><g id="bolt"><path class="bolt-shadow" d="M13.6 14 L86.6 45.2 L25 55 L85.8 82.4" transform="translate(0.7 1.6)" fill="none" stroke="#06203D" stroke-opacity="0.38" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round"/><path class="bolt-stroke" d="M13.6 14 L86.6 45.2 L25 55 L85.8 82.4" fill="none" stroke="url(#g-bolt)" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<path id="edge-highlight" d="M0 100 L0 0 L100 0" transform="matrix(3.8105 2.2 -3.8105 2.2 512 72)" data-flat="matrix(0 0 -6.4 0.0001 832 192)" data-cube="matrix(3.8105 2.2 -3.8105 2.2 512 72)" fill="none" stroke="#BDE8FF" stroke-opacity="0.75" stroke-width="1.0497" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
