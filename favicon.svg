<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="s-title s-desc">
<title id="s-title">Ray2Volt 3D</title>
<desc id="s-desc">Ray2Volt 3D favicon: simplified isometric panel-tile cube with the lightning "2".</desc>
<!-- Small mark for <= 48 DEVICE px (favicons, ICO frames, 1x UI; on HiDPI pages use the master cube), hinted per size: #px16 (hand-drawn pixels) at <= 17 px,
     #s24 at 18-28 px, #s32 at 29-40 px, #s48 (with the 3x3 grid) above 40 px and as the no-CSS fallback. The root has
     no width/height, so the media queries see the drawn size in CSS px (<img>, CSS backgrounds, canvas). Chrome and
     Edge draw an SVG favicon at 32 px (#s32) and shrink it for the tab; the 16 px pixels reach a 1x tab via favicon.ico. -->
<style>#s48{display:inline}@media (max-width:40px){#s48{display:none}#s32{display:inline}}@media (max-width:28px){#s32{display:none}#s24{display:inline}}@media (max-width:17px){#s24{display:none}#px16{display:inline}}</style>
