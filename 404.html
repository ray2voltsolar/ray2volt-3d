<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<!-- Same theme rule as the home page and ray2voltsolar.com: the visitor's saved choice (r2v-theme), else light -->
<script>(function(){var theme='light';try{var saved=localStorage.getItem('r2v-theme');if(saved==='light'||saved==='dark')theme=saved;}catch(e){}document.documentElement.setAttribute('data-theme',theme);if(theme==='dark'){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#0A0F1D');}})();</script>
<title>Page not found | Ray2Volt 3D</title>
<meta name="color-scheme" content="light dark">
<!-- Self-contained on purpose: GitHub Pages serves this file at any missing URL, at any depth, on both
     https://ray2voltsolar.github.io/ray2volt-3d/... and https://3d.ray2voltsolar.com/..., so the links, the logo and
     the favicon start at the published address and the script below points them at the right base for the host. -->
<link rel="icon" id="fav" href="https://ray2voltsolar.github.io/ray2volt-3d/favicon.svg?v=2" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..800&amp;family=Assistant:wght@400..800&amp;display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..800&amp;family=Assistant:wght@400..800&amp;display=swap" rel="stylesheet"></noscript>
<style>
/* The home page's tokens (assets/site.css, from ray2voltsolar.com theme.css), trimmed to what this page uses */
body{--focus:#FFB300;--bg:#0A0F1D;--ink:#fff;--body:rgba(255,255,255,.9);--muted:rgba(226,232,240,.72);--card:rgba(9,14,28,.88);--line:rgba(148,163,184,.24);--grid:rgba(56,189,248,.16);--link:#7DD3FC;--kicker:#FFB300;--ghost-bg:rgba(255,255,255,.04);--ghost-line:rgba(255,255,255,.2);--shadow:0 30px 60px -30px rgba(0,0,0,.85)}
:root:not([data-theme="dark"]) body{--focus:#0277BD;--bg:#fff;--ink:#1B2735;--body:#384657;--muted:#5B6B7E;--card:#fff;--line:#D5DDE7;--grid:rgba(3,169,244,.13);--link:#0277BD;--kicker:#0277BD;--ghost-bg:#fff;--ghost-line:#CBD5E1;--shadow:0 24px 48px -28px rgba(15,23,42,.3)}
:root[data-theme="dark"]{color-scheme:dark}:root[data-theme="light"]{color-scheme:light}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:max(1rem,env(safe-area-inset-top)) max(1rem,env(safe-area-inset-right)) max(2rem,env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left));background-color:var(--bg);color:var(--body);font:500 1rem/1.6 'Assistant',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;background-position:center top}
header{width:100%;max-width:1280px;display:flex;align-items:center;height:56px;padding:0 1.25rem;border:1px solid rgba(229,231,235,.6);border-radius:1.5rem;background:rgba(255,255,255,.92);box-shadow:0 4px 20px rgba(0,0,0,.08)}
header a{display:inline-flex;border-radius:8px}
header img{height:30px;width:auto}
#logo:not([src]){display:none}
@media (max-width:768px){header{height:52px;padding:0 1rem}header img{height:26px}}
@media (max-width:480px){header img{height:25px}}
@media (max-width:360px){header img{height:22px}}
main{width:100%;max-width:520px;margin:auto 0;padding:2.25rem 1.5rem 2rem;position:relative;border:1px solid var(--line);border-radius:24px;background:var(--card);text-align:center;box-shadow:var(--shadow)}
main::before{content:'';position:absolute;top:-1px;left:1.75rem;right:1.75rem;height:2px;border-radius:2px;background:#FFB300}
.code{display:inline-flex;align-items:center;gap:.625rem;margin-bottom:.75rem;font:700 .75rem/1 'Google Sans','Google Sans Flex',system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--kicker)}
.code::before{content:'';width:18px;height:2px;border-radius:2px;background:currentColor}
h1{font:700 clamp(1.625rem,1.2rem + 1.6vw,2.125rem)/1.15 'Google Sans','Google Sans Flex',system-ui,sans-serif;letter-spacing:-.03em;color:var(--ink);margin-bottom:.625rem;text-wrap:balance}
p{color:var(--muted)}
.actions{display:grid;gap:.625rem;margin-top:1.5rem}
a.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:50px;padding:.75rem 1.5rem;border-radius:999px;font:600 .9375rem/1.6 'Google Sans','Google Sans Flex',system-ui,sans-serif;text-decoration:none}
.btn-home{background:linear-gradient(135deg,#FFB300 0%,#FFD54F 50%,#F9A825 100%);color:#1A1A1A;box-shadow:0 4px 20px rgba(255,179,0,.35)}
.btn-ghost{background:var(--ghost-bg);color:var(--ink);border:1px solid var(--ghost-line)}
.btn-ghost:hover{border-color:#FFB300}
.mail{margin-top:1.25rem;font-size:.9375rem}
.mail a{color:var(--link);text-decoration:underline;text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
header a:focus-visible{outline-color:#0277BD}
</style>
</head>
<body>
<header>
  <!-- The logo has no src here: the script at the end gives it the right address for this host, so it is fetched
       once. Without JavaScript the noscript copy loads it from the published address. -->
  <a class="home-link" href="https://ray2voltsolar.github.io/ray2volt-3d/" aria-label="Ray2Volt 3D home"><img id="logo" data-src="assets/ray2volt-3d-logo-h64.png" alt="Ray2Volt 3D" width="590" height="64"><noscript><img src="https://ray2voltsolar.github.io/ray2volt-3d/assets/ray2volt-3d-logo-h64.png" alt="Ray2Volt 3D" width="590" height="64"></noscript></a>
</header>
<main>
  <p class="code">Error 404</p>
  <h1>This page isn't here</h1>
  <p>The link may be old or mistyped. The Ray2Volt 3D home page has the live demos, pricing and the enquiry form.</p>
  <div class="actions">
    <a class="btn btn-home home-link" href="https://ray2voltsolar.github.io/ray2volt-3d/">Go to the home page</a>
    <a class="btn btn-ghost" data-path="#enquire" href="https://ray2voltsolar.github.io/ray2volt-3d/#enquire">Get a quote</a>
  </div>
  <p class="mail">Or email <a href="mailto:3d@ray2voltsolar.com">3d@ray2voltsolar.com</a>. Prefer WhatsApp? <a data-path="#whatsapp" href="https://ray2voltsolar.github.io/ray2volt-3d/#whatsapp">Use the enquiry form</a> and tap Send on WhatsApp.</p>
</main>
<script>
(function () {
  // Home is /ray2volt-3d/ on github.io (and on the local test server's subpath), / on the custom domain.
  var logo = document.getElementById('logo');
  if (location.protocol !== 'http:' && location.protocol !== 'https:') {
    logo.setAttribute('src', 'https://ray2voltsolar.github.io/ray2volt-3d/' + logo.getAttribute('data-src'));
    return;
  }
  var sub = /\.github\.io$/i.test(location.hostname) || location.pathname.indexOf('/ray2volt-3d/') === 0 || location.pathname === '/ray2volt-3d';
  var base = sub ? '/ray2volt-3d/' : '/';
  Array.prototype.forEach.call(document.querySelectorAll('.home-link'), function (a) { a.setAttribute('href', base); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-path]'), function (a) { a.setAttribute('href', base + a.getAttribute('data-path')); });
  logo.setAttribute('src', base + logo.getAttribute('data-src'));
  document.getElementById('fav').setAttribute('href', base + 'favicon.svg');
})();
</script>
</body>
</html>
